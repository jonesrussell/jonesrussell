name: Content Mining

on:
  schedule:
    # Run daily at 11:00 UTC
    - cron: '0 11 * * *'
  workflow_dispatch:
    inputs:
      days:
        description: 'Lookback window in days'
        required: false
        default: '1'

permissions:
  issues: write
  contents: read

jobs:
  mine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout blog
        uses: actions/checkout@v4
        with:
          repository: jonesrussell/blog

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies (ajv for seed validation)
        run: npm ci

      - name: Run canonical mining script
        env:
          # CROSS_REPO_TOKEN must have read:org scope to access waaseyaa/* private repos.
          # Falls back to GITHUB_TOKEN for public repos only.
          GH_TOKEN: ${{ secrets.CROSS_REPO_TOKEN || secrets.GITHUB_TOKEN }}
          LOOKBACK_DAYS: ${{ github.event.inputs.days || '1' }}
          CI: 'true'
        run: bash scripts/mine-git-activity.sh
